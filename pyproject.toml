[project]
name = "flapi"
version = "1.0.1"
description = "Remotely control FL Studio using the MIDI Controller Scripting API"
authors = [
    {name = "Maddy Guthridge", email = "hello@maddyguthridge.com"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
keywords = [
    "fl",
    "studio",
    "fl studio",
    "midi",
    "script",
    "midi controller scripting",
    "remote",
    "remote control",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Development Status :: 4 - Beta",
    "Environment :: Other Environment",
    "Typing :: Typed",
]
dependencies = [
    "fl-studio-api-stubs>=37.0.0",
    "mido[ports-rtmidi]>=1.3.2",
    "typing-extensions>=4.9.0",
    "click>=8.1.7",
    "click-default-group>=1.2.4",
]

[project.urls]
"Online Documentation" = "https://maddyguthridge.github.io/Flapi"
"Bug Tracker" = "https://github.com/MaddyGuthridge/Flapi/issues"

[project.scripts]
flapi = "flapi.__main__:cli"

[project.optional-dependencies]
ipython = ["ipython>=8.18.1,<10.0.0"]

[dependency-groups]
dev = [
    "pytest>=7.3.1,<10.0.0",
    "mypy>=1.19.1",
    "typing-extensions>=4.15.0",
    "coverage>=7.10.7",
    "ruff>=0.14.10",
]
[tool.uv]
# Exclude dependency releases newer than 1 week, in order to reduce supply-chain
# risk.
exclude-newer = "1 week"

[build-system]
requires = ["uv_build>=0.9.5,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "flapi"
module-root = ""

[tool.mypy]
exclude = ['flapi/server/*']
python_version = "3.12"
